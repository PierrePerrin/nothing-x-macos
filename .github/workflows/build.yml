# Builds the macOS app on every pull request and push to main, and publishes a
# GitHub Release with the built app attached whenever a version tag is pushed.
#
# This is an Xcode project (there is no Package.swift), so it is built with
# xcodebuild. `swift build` / `swift test` only work for SwiftPM packages.
#
# The app is ad-hoc signed (no Apple Developer certificate is needed), so it is
# not notarized: on first launch macOS asks the user to confirm opening it.
#
# To publish a release:
#   git tag v3.1.0 && git push origin v3.1.0
# Tags with a suffix (v3.1.0-beta.1) are published as pre-releases.

name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT: Nothing X MacOS.xcodeproj
  TARGET: Nothing X MacOS
  APP_NAME: Nothing X MacOS

jobs:
  build:
    name: Build app
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Work out the version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
          LABEL="$VERSION"
        else
          # Keep the version from the project, label the artifact with the commit.
          VERSION=""
          LABEL="$(git rev-parse --short HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            LABEL="pr${{ github.event.pull_request.number }}-$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)"
          fi
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "label=$LABEL" >> "$GITHUB_OUTPUT"
        echo "Version: ${VERSION:-<from project>}, label: $LABEL"

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build (Release, universal, ad-hoc signed)
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        EXTRA=()
        if [[ -n "$VERSION" ]]; then
          EXTRA+=("MARKETING_VERSION=$VERSION")
        fi
        xcodebuild build \
          -project "$PROJECT" \
          -target "$TARGET" \
          -configuration Release \
          -sdk macosx \
          SYMROOT="$PWD/build" \
          ARCHS="arm64 x86_64" \
          ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="-" \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
          "${EXTRA[@]}"

    - name: Check the app
      run: |
        APP="build/Release/$APP_NAME.app"
        test -d "$APP"
        codesign --verify --deep --strict --verbose=2 "$APP"
        lipo -info "$APP/Contents/MacOS/$APP_NAME"
        /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"

    - name: Package zip and dmg
      id: package
      env:
        LABEL: ${{ steps.version.outputs.label }}
      run: |
        mkdir -p dist
        BASE="Nothing-X-MacOS-$LABEL"
        APP="build/Release/$APP_NAME.app"

        ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/$BASE.zip"

        STAGING="$(mktemp -d)"
        cp -R "$APP" "$STAGING/"
        ln -s /Applications "$STAGING/Applications"
        hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING" \
          -ov -format UDZO "dist/$BASE.dmg"

        (cd dist && shasum -a 256 *.zip *.dmg > SHA256SUMS.txt)
        cat dist/SHA256SUMS.txt
        echo "base=$BASE" >> "$GITHUB_OUTPUT"

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.package.outputs.base }}
        path: dist/*
        if-no-files-found: error
        retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 90 || 14 }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Create or update the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: |
        ls -l dist
        FLAGS=()
        if [[ "$TAG" == *-* ]]; then
          FLAGS+=(--prerelease)
        fi
        if gh release view "$TAG" >/dev/null 2>&1; then
          # Re-running the workflow for an existing tag replaces the files.
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* \
            --title "Nothing X MacOS $TAG" \
            --generate-notes \
            --verify-tag \
            "${FLAGS[@]}"
        fi
